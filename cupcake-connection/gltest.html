<!doctype html><html><body style="font:16px monospace;padding:20px"><h1>gl test</h1><pre id="o">running</pre><canvas id="c" width="300" height="300" style="border:1px solid #000"></canvas><script>
var VS="attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}";
var FS=[
"#ifdef GL_FRAGMENT_PRECISION_HIGH",
"precision highp float;",
"#else",
"precision mediump float;",
"#endif",
"uniform vec2 uRes;uniform float uSpin;uniform vec2 uTilt;uniform float uTime;",
"const float FB=-0.02;const float FT=1.22;const float TAU=6.2831853;",
"mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}",
"mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}",
"mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.,-s,c,0.,0.,0.,1.);}",
"float hash(float n){return fract(sin(n)*43758.5453);}",
"float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}",
"float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}",
/* frosting radius: tapering cone + spiral piping ridge */
"float swirl(float y,float a){return 0.5+0.5*cos(TAU*y/0.29-a);}",
"float frostR(float y,float a){float t=clamp((y-FB)/(FT-FB),0.,1.);float c=swirl(y,a);return 1.02*pow(1.-t,0.78)+0.15*c*c*(1.-0.5*t);}",
"float wrapR(float y,float a){float t=clamp((y+1.25)/1.27,0.,1.);return mix(0.74,1.0,t)+0.022*abs(sin(15.*a));}",
"const vec3 CH=vec3(0.03,FT+0.13,0.0);",
"vec2 map(vec3 p){",
"  float q=length(p.xz);float a=atan(p.z,p.x);",
/* wrapper */
"  float dw=max((q-wrapR(p.y,a))*0.78,abs(p.y+0.615)-0.635);",
"  vec2 r=vec2(dw,1.);",
/* frosting */
"  float df=(q-frostR(p.y,a))*0.55;",
"  df=max(df,FB-p.y);df=max(df,p.y-FT-0.02);",
"  float tor=length(vec2(q-0.93,p.y-0.06))-0.17;",
"  df=smin(df,tor,0.12);",
"  df=smin(df,length(p-vec3(0.,FT-0.12,0.))-0.13,0.1);",
"  if(df<r.x)r=vec2(df,2.);",
/* cherry + stem */
"  vec3 cp=p-CH;float dc=length(cp)-0.25;",
"  dc+=0.035*exp(-dot(cp.xz,cp.xz)*60.)*step(0.,cp.y);",
"  if(dc*0.9<r.x)r=vec2(dc*0.9,3.);",
"  float ds=sdCap(p,CH+vec3(0.,0.2,0.),CH+vec3(0.15,0.56,0.05),0.022);",
"  if(ds<r.x)r=vec2(ds,4.);",
/* sprinkles (only near frosting) */
"  if(df<0.3){",
"    for(int i=0;i<26;i++){",
"      float fi=float(i);float sa=fi*2.39996+0.3;float sy=0.14+hash(fi*7.13)*0.9;",
"      float sr=frostR(sy,sa)+0.004;",
"      vec3 c=vec3(cos(sa)*sr,sy,sin(sa)*sr);",
"      vec3 n0=normalize(vec3(cos(sa),0.45,sin(sa)));",
"      vec3 dir=vec3(hash(fi*3.31)-.5,hash(fi*5.77)-.5,hash(fi*9.17)-.5);",
"      dir=normalize(dir-n0*dot(dir,n0)+vec3(1e-4));",
"      float dd=sdCap(p,c-dir*0.085,c+dir*0.085,0.034);",
"      if(dd<r.x)r=vec2(dd,5.+fi);",
"    }",
"  }",
"  return r;",
"}",
"vec3 nrm(vec3 p){vec2 e=vec2(0.0015,-0.0015);return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}",
"vec3 env(vec3 r){vec3 c=mix(vec3(0.25,0.08,0.22),vec3(1.,0.86,0.93),smoothstep(-0.3,0.8,r.y));c+=vec3(1.)*exp(-abs(r.y-0.25)*14.)*0.35;c+=vec3(0.66,0.9,0.8)*smoothstep(0.3,1.,-r.x)*0.35;return c;}",
"vec3 sprCol(float k){float h=hash(k*13.7);",
"  if(h<0.2)return vec3(1.,0.45,0.66);if(h<0.4)return vec3(0.55,0.88,0.72);if(h<0.6)return vec3(0.76,0.66,1.);",
"  if(h<0.8)return vec3(1.,0.86,0.42);return vec3(0.5,0.75,1.);}",
"void main(){",
"  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;",
"  vec3 ro=vec3(0.,0.32,6.2);vec3 rd=normalize(vec3(uv*0.68,-1.));",
"  mat3 R=rotX(uTilt.x)*rotZ(uTilt.y)*rotY(uSpin);",
"  mat3 Ri=rotY(-uSpin)*rotZ(-uTilt.y)*rotX(-uTilt.x);",
"  vec3 o=Ri*(ro-vec3(0.,0.32,0.))+vec3(0.,0.32,0.);vec3 d=Ri*rd;",
/* bounding sphere */
"  vec3 oc=o-vec3(0.,0.32,0.);float b=dot(oc,d);float h=b*b-dot(oc,oc)+4.2;",
"  float glowD=10.;",
"  if(h<0.){gl_FragColor=vec4(0.);return;}",
"  h=sqrt(h);float t=max(-b-h,0.);float tE=-b+h;",
"  float id=-1.;",
"  for(int i=0;i<84;i++){",
"    vec3 p=o+d*t;vec2 m=map(p);",
"    glowD=min(glowD,m.x);",
"    if(m.x<0.0012*t){id=m.y;break;}",
"    t+=m.x;if(t>tE)break;",
"  }",
"  vec3 rim=vec3(1.,0.62,0.82);",
"  if(id<0.){float g=exp(-max(glowD,0.)*5.)*(0.5+0.06*sin(uTime*2.));gl_FragColor=vec4(rim*g,g);return;}",
"  vec3 p=o+d*t;vec3 nl=nrm(p);vec3 n=normalize(R*nl);vec3 v=-rd;",
"  vec3 L=normalize(vec3(0.55,0.75,0.6));vec3 F2=normalize(vec3(-0.7,0.2,0.4));",
"  float ndl=max(dot(n,L),0.);float ndv=clamp(dot(n,v),0.,1.);",
"  float ao=clamp(0.45+map(p+nl*0.08).x*7.,0.,1.);",
"  vec3 hv=normalize(L+v);float nh=max(dot(n,hv),0.);",
"  vec3 rf=reflect(-v,n);float fr=0.04+0.96*pow(1.-ndv,5.);",
"  vec3 col;float q=length(p.xz);float a=atan(p.z,p.x);",
"  if(id<1.5){",
"    float rg=abs(sin(15.*a));vec3 base=mix(vec3(0.93,0.42,0.6),vec3(1.,0.72,0.82),rg);",
"    base=mix(base,vec3(1.,0.95,0.97),(1.-smoothstep(0.,0.012,abs(fract(p.y*2.2+0.1)-0.5)-0.47))*0.6);",
"    col=base*(0.25+0.8*ndl)*ao+vec3(0.8,0.7,1.)*max(dot(n,F2),0.)*0.18*base;",
"    col+=vec3(1.)*pow(nh,30.)*0.35*rg;col+=env(rf)*fr*0.25;",
"  }else if(id<2.5){",
"    float c=swirl(p.y,a);vec3 base=mix(vec3(1.,0.68,0.8),vec3(1.,0.9,0.94),c);",
"    float wrap=max((dot(n,L)+0.35)/1.35,0.);",
"    col=base*(0.22+0.85*wrap)*ao;",
"    col+=vec3(1.,0.45,0.6)*(1.-wrap)*0.12;",
"    col+=vec3(0.8,0.7,1.)*max(dot(n,F2),0.)*0.2*base;",
"    col+=vec3(1.)*pow(nh,90.)*1.3;col+=vec3(1.)*pow(nh,14.)*0.12;",
"    col+=env(rf)*fr*0.75;",
"  }else if(id<3.5){",
"    vec3 base=vec3(0.78,0.04,0.12);",
"    col=base*(0.18+0.9*ndl)+vec3(1.)*pow(nh,160.)*2.4+env(rf)*(0.08+fr)*0.9;",
"  }else if(id<4.5){",
"    col=vec3(0.33,0.5,0.15)*(0.3+0.8*ndl)+vec3(1.)*pow(nh,40.)*0.3;",
"  }else{",
"    vec3 base=sprCol(id-5.);col=base*(0.3+0.8*ndl)*ao+vec3(1.)*pow(nh,60.)*0.8+env(rf)*fr*0.4;",
"  }",
"  col+=rim*pow(1.-ndv,3.)*0.85;",
"  col=col/(1.+0.22*col);",
"  gl_FragColor=vec4(col,1.);",
"}"
].join("\n");
var o=document.getElementById("o"),out=[];
var c=document.getElementById("c");var g=c.getContext("webgl")||c.getContext("experimental-webgl");
if(!g){out.push("NO WEBGL CONTEXT");}else{
out.push("renderer: "+g.getParameter(g.RENDERER)+" | "+g.getParameter(g.VERSION));
var hp=g.getShaderPrecisionFormat(g.FRAGMENT_SHADER,g.HIGH_FLOAT);out.push("highp frag precision: "+hp.precision);
function mk(t,src,n){var s=g.createShader(t);g.shaderSource(s,src);g.compileShader(s);out.push(n+" compile: "+g.getShaderParameter(s,g.COMPILE_STATUS)+" log: "+g.getShaderInfoLog(s));return s;}
var p=g.createProgram();g.attachShader(p,mk(g.VERTEX_SHADER,VS,"VS"));g.attachShader(p,mk(g.FRAGMENT_SHADER,FS,"FS"));g.linkProgram(p);out.push("link: "+g.getProgramParameter(p,g.LINK_STATUS)+" "+g.getProgramInfoLog(p));}
o.textContent=out.join("\n");
</script></body></html>
